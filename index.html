<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fde6ee">
  <title>For you</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="jardim" role="img" aria-label="A garden of lilies slowly blooming"></canvas>

  <header class="texto" id="texto">
    <h1 id="titulo">For you</h1>
    <p id="mensagem"></p>
  </header>

  <footer class="rodape">
    <p class="dica">Tap the garden to plant a lily</p>
    <button type="button" id="replantar">Replant the garden</button>
  </footer>

  <noscript>
    <p class="sem-js">This garden needs JavaScript to bloom.</p>
  </noscript>

  <script src="main.js"></script>
</body>
</html>
